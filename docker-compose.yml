services:
  client:
    build:
      context: ./client
    image: ecoride-client:v1.0
    container_name: client
    networks:
      - front
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ./server
    image: ecoride-server:v1.0
    container_name: server
    networks:
      - front
      - back
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8
    command: --mysql-native-password=ON
    container_name: mysql-database
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - back
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7
    container_name: mongodb-database
    volumes:
      - mongodb_data:/data/db
      - mongodb_config_data:/data/configdb
    networks:
      - back
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mysql_data:
  mongodb_data:
  mongodb_config_data:

networks:
  front:
    driver: bridge
  back:
    driver: bridge
